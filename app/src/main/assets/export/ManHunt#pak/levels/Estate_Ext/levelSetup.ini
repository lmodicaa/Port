# LevelSetup.ini
#
# Stores various values that need to be define at the start of each level.
# E.g. fog parameters, weather etc.
# Fog types: LINEAR, EXP, EXP2

RECORD levelSetup
	FOG_COLOUR       17,17,17,150
      	FOG_TYPE          LINEAR
     	FOG_DENSITY       1
      	FAR_CLIP          40.0
END
####################################################################################################
RECORD CLOUDY
	AVOID
END
####################################################################################################
RECORD WINDY
	AVOID
END
###################################################################################################
RECORD RAINY
	AVOID
END
####################################################################################################
RECORD THUNDERSTORM
	AVOID
END
####################################################################################################
RECORD FOGGY
	FARCLIP 	40.0f
	FOGSTART	10.0f
	SKY		17,17,17
	CLOUDS		17,17,17
END
####################################################################################################
RECORD CLEAR
	AVOID
END

