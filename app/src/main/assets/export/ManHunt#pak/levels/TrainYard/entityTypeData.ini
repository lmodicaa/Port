# WARNING: do not edit this file by hand. To add entities make the changes to
#		the AllEntitiesTypeData.ini file in the levels/global directory and
#		run the extraction script again. You have been warned.

# If you want to comment a particular record then put the comment after the RECORD line as
# comments between records are removed at extraction time, or put the comment in a dummy record
# which will not be extracted.



###############################################################################
#
#	FIELD DESCRIPTIONS
#	==================
#
#	All entities contain the following fields:
#
#		MODEL			- the model file 
#		NAME			- the name of the entity (MAX of 12 characters)
#		ANIMATION		- name of the animation file to load for this entity
#		PHYSICS			- name of the physics type to use for this entity
#		HIT_POINTS		- the max health of the entity
#		ARMOUR_CLASS		- the armour type: NONE/LIGHT/MEDIUM/HEAVY/EXTREME
#		WEAPON			- a weapon the entity can use: UZI/BAZOOKA/MAGNUM, etc
#		LOD_DISTANCE	- distance over which LOD switching takes place
#		LOD_INFO		- defines which LOD to use for each 1/10th of the LOD_DISTANCE
#		LOD_DATA		- determines model idx, draw distance & damage
#					% to draw each entity at. (last field not used)
#		IMPULSE_LIMIT		- amount of impulse this entity can be subject to before being damaged
#		CUSHION_ON		- signifies that this entity will not generate impulse damage on colliding entities
#
#
#	RECORD TAGS
#	===========
#
#	The following tags can be place before records to control extraction. Must be comments.
#
#		#FORCE			- force this record to be extracted even if it does not appear in the entities.a3d file
#
#	SPECIAL RECORDS
#       ===============
#
#       Records of type 'dummy' bypassed by the game at the archetyping stage. They are used to store
#	data required by colim extractor functions or for comments.
#
###########################################################################


