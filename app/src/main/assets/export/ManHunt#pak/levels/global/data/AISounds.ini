# This is special ID's that are ignored except under special circumstances
# SNEAKING is ignored unless sneaking on gravel, where the sound is upgraded to walking
	SNEAKING		very_low	very_low	true

# This is here for the radar display rather than for any purpose that Hunters will find useful
	SPEECH			medium		very_low	false
END




