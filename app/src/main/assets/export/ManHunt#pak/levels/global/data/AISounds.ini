##########################################################################################
# KEITH CHANGE 12/7/01
#
#	HUNTER AUDIO
#
#	These are sounds that the player makes and which the Hunter might find interesting,
#	plus a few others (like a Hunter shouting: 'There he is!', etc).  Each sound has a
#	volume and interest level associated with it, both of which should be a value of:
#	very_low, low, medium, high, or very_high (where very_low is almost silent).
#
#	The volume dissipates over distance, so at the source of the noise the volume is
#	heard at the level in this file.  This volume level falls as the distance increases.
#
#	When a number of noises are heard in one frame, only the loudest most interesting
#	noise will be selected.  Only if the volume of this noise is greater than the
#	background noise will it be heard.
#
#	When a noise is heard, its interest level is passed to the AI to use in decision
#	making.  Depending on which action state the AI is currently in, this interest
#	level of noise may or may not cause a reaction within the entity.
#
#	Keith McLeman 14/9/01
#	Added a confusion Boolean Value.
#	Obvious noises (like Gunshot) that cannot be mistaken for anything else will have
#	a false value.  This means that if the Gunshot is heard, then it will return the
#	interest level specified in the file.  Less obvious noises (like footsteps), are
#	set to true.  This means that, if the sound is heard, it is at a degraded level.
#
#	Keith McLeman 23/11/01
#	These sounds are now used as Background noises also.  The two files are combined.
#	ALL sounds should be listed in the Interesting Sounds list.
#
##########################################################################################

# Suggest putting in order very_low -> very_high by Interest Level
#
#	Sound Name		volume		interest level	confusion
#
RECORD INTERESTING_SOUNDS
# Fire Button Test is an interesting sound that, if active, gets triggered every time the
# fire button is pressed.  It is used for hearing test purposes.
#	FIRE_BUTTON_TEST	very_high	very_high	true
	LURE_EXPLOSION		very_high	very_high	false
	GUN_SHOT		very_high	very_high	false
	ALARM			high		very_high	true
	GUN_SHOT_SILENCED	very_low	very_high	false
	ALERT_OTHERS_VERY_HIGH	very_high	high		true
	ALERT_OTHERS_HIGH	high		high		true
	EXECUTION_MEDIUM	medium		high		false
	ALERT_OTHERS_MEDIUM	medium		high		true
	ALERT_OTHERS_LOW	low		high		true
	ALERT_OTHERS_VERY_LOW	very_low	high		true
	ALERT_OTHERS_SILENT	very_low	high		true
	EXECUTION_LOW		low		high		false
	EXECUTION_VERY_LOW	very_low	high		false
	LURE_BREAK_WINDOW	high		high		true
	LURE_SHOOTING_AT_ME	high		medium		false
	LURE_HIGH		high		medium		false
	LURE_MEDIUM		medium		medium		false
	LURE_THROWN_MEDIUM	medium		medium		false
	DOOR_BANG		medium		medium		false
	FALL_LAND		medium		medium		true
	LURE_LOW		low		medium		false
	LURE_THROWN_LOW		low		medium		false
	SPRINTING		low		medium		true
	RUNNING			low		medium		true
