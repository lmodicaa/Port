############################################################################################
#
#	EntityStateSounds
#	=================
#	
#	Each state of an entity usually makes a noise, or a number of different noises.
#	The overall volume for each state is held here - this effects how likely a hunter
#	is able to hear the player, as the sound volume levels being emitted from neighbouring
#	entities may drown out any noises the player is making.
#  
############################################################################################

# these values are half what the player ones are

RECORD default_hunter
	TYPE		EC_HUNTER
	STAND		0.01
	WALKFORWARDS	0.05
	RUNFORWARDS	0.1
	RUNJUMPLAUNCH	0.2
	RUNJUMPGLIDE	0.025
	RUNJUMPLAND	0.15
	FIREWEAPON	1.0
END
