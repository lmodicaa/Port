#
# FIRE ANIMS: 
#	A weapon can use a variety of different fire anims. There are 4 cases:	
#		1) FIRE_ANIM - only one fire ahead anim
#		
#		2) FIREUP_ANIM and FIREDOWN_ANIM - one fire up anim, one fire down
#
#		3) FIRENW_ANIM, FIRENE_ANIM, FIRESW_ANIM and FIRESE_ANIM - one anim for each of the
#			corners of the aim area
#
#		4) FIRENW_ANIM, FIREN_ANIM, FIRENE_ANIM, FIREW_ANIM, FIREAHEAD_ANIM, FIREE_ANIM,
#			FIRESW_ANIM, FIRES_ANIM, FIRESW_ANIM - all corners and midpoints
#
# MAX_SHOTS - the maximum number to active shots at any one time
# RECOIL_DIST - 2 numbers: the vertical distance the camera travels upwards when the weapon is fired
#		and the horizontal distance the camera travels sideways when the weapon is fired
# RECOIL_TIME - how long it takes for the camera to recentre after the weapon is fired
# RECOIL_VERT_ACCUMULATOR - how much the vertical recoil distance increases when the weapon is fired
#			    this number is multiplied by the time the fire button has been held down
#			    and added to the normal vertical recoil distance defined in RECOIL_DIST
# MAX_RECOIL_VERT_DIST	- the maximum vertical recoil distance allowed after the accumulator has
#			  been applied
# RECOIL_RETURN_ACCURACY - Ranges from 0 to 1. 1 means the recoil will always return to the exact 
#			position where it started. If the value is 0.8 for example, the recoil will
#			return to a random value between 80 and 100 percent of the total distance it 
#			travels away from its starting position 
#
##################################### Shooters ###################################################

RECORD nailGun
	CLASS		WC_AMMO
	SHOT_TYPE_1	nailGunShot
	MAX_CLIPS	6
	CLIP_AMMO	30
	MAX_SHOTS	1
	MIN_FIRE_RANGE  14
	MAX_FIRE_RANGE  16
	MAX_FIRE_RANGE_HIT_PROBABILITY	0.125
	RECOIL_DIST		3, 0
	RECOIL_TIME		0.2
	SHOT_SPREAD	0
	DROPPED_AMMO	10
	SMOKE_SHELL_FX		glock_shell_smoke
	LOCKON_TARGET_RANGES	5.0, 8.0
# the distance to a lock on target at which the aiming accuracy changes:
# if dist < first value then lock on aims at the target’s head automatically
# if dist < second value then the player is allowed to lock on to the target's head manually
	NUM_HEAD_SHOTS	3
# the number of shots to the head it takes to kill a ped using this weapon
	TORSO_DAMAGE_MULTIPLIER	1.0
# multiplied by the weapon damage whenever the torso is hit to calculate the total damage to the ped
	ARM_DAMAGE_MULTIPLIER	1.0
# multiplied by the weapon damage whenever the arms are hit to calculate the total damage to the ped
	LEG_DAMAGE_MULTIPLIER	0.5
# multiplied by the weapon damage whenever the legs are hit to calculate the total damage to the ped
END

