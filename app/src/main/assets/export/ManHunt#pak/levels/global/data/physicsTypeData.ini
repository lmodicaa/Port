############################################################################################################################################	
#
#	FIELD DESCRIPTIONS
#	==================
#
#	All entities contain the following fields:
#
#		PHYSICS_CLASS		- one of : POINT_MASS - the entity is treated as a single point in space with no orientation, such as
#								 a particle, character or alien.
#					   OBJECT_CUBOID - the entity is treated as an object in the shape of a box
#					   OBJECT_SPHERE - the entity is treated as an object in the shape of a sphere.
#		DIMENSIONS		- the x,y,z dimensions of the entity (this must be as accurate as possible)
#		MASS			- the mass of the entity
#		CENTRE_OF_MASS		- the vector from the pivot point of the entity's model to its centre of mass (the 'balance point' of
#					 the entity)
#		FRICTION_CLASS		- determines how friction is calculated. Can be SIMPLE_FRICTION or PROPER_FRICTION. Simple friction 
#					involves far less processing but has the effect that the entity will always slide down a slight 
#					slope. With proper friction applied, the entity will 'stick' on the slope up to a certain gradient.
#		FRICTION 		- the friction value. With simple friction this should be around 0.2, with proper friction this value 
#					influences how well the entity will stick to the slope before sliding. Try a similar value.
#		GRAVITY			- the magnitude of the gravitational force (should be around 0.55)
#		BOUNCE			- the bounciness of the entity. A value between 0 & 1, 0 = no bounce, 1 = super bouncy. Should really 
#					be no less than 0.1.
#		MAX_SPEED		- how fast the entity can travel. A car usually travels no faster than around 40.
#
#	All vehicles contain all of the above fields, plus the following:
#
#		STEERING_SPEED		- how fast the vehicle turns. A car is usually about 0.006.
#		STEERING_CHANGE		- how much the steering speed is reduced as the vehicle gets faster. A car is about 10. This is a 
#					bit crappily done at the moment and will probably change.
#
#	All wheeled vehicles contain all of the above fields, plus the following:
#
#		NUM_REAR_WHEELS 	- Number of rear wheels, either 0, 2 or 4.
#		NUM_FRONT_WHEELS	- Number of front wheels, either 0, 2 or 4.	
#		WHEEL_DRIVE		- NO_WHEEL_DRIVE/REAR_WHEEL_DRIVE/FRONT_WHEEL_DRIVE/FOUR_WHEEL_DRIVE		
#		MAX_REVS		- Usually about 100
#		FRONT_SUSP_LENGTH	- How long the front suspension springs are (usually about 10)
#		FRONT_SUSP_STRENGTH	- How strong the front suspenion springs are (independent of the vehicles mass). Try about 0.0004.
#		FRONT_SUSP_DAMP		- How much the front suspenion springs are damped (how long they take to come to rest). This is a
#					percentage of the strength and should be about 0.5.
#		REAR_SUSP_LENGTH	
#		REAR_SUSP_STRENGTH	Same for rear suspension
#		REAR_SUSP_DAMP
#		WHEEL_RADIUS_F		- The radius of the collision spheres for the front wheels. If this is wrong, the front wheels will
#					appear either sunken into the ground, or floating above it.
#		WHEEL_RADIUS_R		- Same for rear wheels
#		MAX_WHEEL_ANGLE		- The max angle the front wheels can be turned (usually about 50)
#		ROLLING_FRICTION	- Determines how long the vehicle will come to rest when rolling in a straight line. Try about 0.002
#		FRONT_STICTION		- How 'sticky' the front tires are, or how much they will grip before skidding. Usually about 0.3 ish
#		REAR_STICTION		- Same for rear tires
#		TRACTION		- Not used yet
#		BRAKING_FRICTION	- Determines how quickly the vehicle will come to rest when the brakes are applied. Usually about 0.01
#		HAND_BRAKING_FRICTION	- How much friction the locked rear wheels provide when the handbrake is on. Usually about 0.03.
#		MAX_BRAKE_TIME		- How long the vehicle will brake for before reversing. Usually about 30.
#		WHEEL_ROT_SPEED_F	- How fast the front wheels turn depending upon the vehicles speed (just cosmetic). Tweak this until 
#					the wheels roll convincingly on the ground. This depends on the size of the wheels on the model. 
#		WHEEL_ROT_SPEED_R	- Same for rear wheels.
#		STATIONARY_FORCE	- The wheel positions, numbers, suspension forces, wheel radii and centre of mass all conspire to 
#					stop a vehicle from sitting still when on a flat surface - it will always tend to roll off forwards
#					or backwards. This value determines the strength of force to apply to keep a vehicle stationary. A 
#					positive value will stop a vehicle rolling backwards, and a negative one will stop a vehicle rolling
#					forwards. Do this last, as changing any of the above factors will affect this value.
#		GEAR_DRIVE_FORCES_N	- The drive force applied to the wheels when the vehicle is in gear N. Lower gears provide stonger
#					forces than higher gears.
#		GEAR_MIN_SPEEDS_N	- The minimum speed the vehicle is allowed to travel in gear N.
#		GEAR_MAX_SPEEDS_N	- The maximum speed the vehicle is allowed to travel in gear N.
# 
#	All planes contain the vehicle fields plus the following:
#
#		DRIVE_FORCE		- The force the propellers/jets provide. A biplane has a drive force of 0.002
#		MAX_FLAP_ANGLE		- The maximum angle all the flaps can turn. Usually about 50
#		PROP_ROT_SPEED		- How fast the propellers turn (just cosmetic). Try about 40
#		RUDDER_FORCE		- How much friction force the rudder has, or how much turning the rudder will affect the tail of the
#					plane. At the moment this isn't used.
#		LIFT_FORCE		- How much lift force the plane has, or how quickly it will take off. This is also affected by the 
#					wing friction forces as well. Try 0.008.
#		FRONT_FLAPS_FORCE	- How much friction force the front flaps have, or how much turning these flaps affects how the plane
#					will dive or roll. Usually about 0.2
#		REAR_FLAPS_FORCE	- Same for rear flaps
#		WING_FRICT_FORCE	- How much friction force the front and back wings have, or how much the plane will travel in a 
#					straight line without vearing up or down. Usually about 0.3
#		TAIL_FRICT_FORCE	- How much friction force the tail fin has, or how much the plane will travel in a straight line 
#					without vearing left or right. Usually about 0.1.
#		MIN_PROP_SPEED		- Not used at the moment
#		AIR_RESISTANCE		- Determines how quickly the roll or pitch of plane will come to rest after the user stops turning 
#					it. Try about 0.05
#
#############################################################################################################################################
