########################################################################################
#
# Communications.ini file
#
# Contains a number of records that allow communication anims and speech to be issued
# under various circumstances.
#
# Records have a type (like GOTO_LOCATION), or can be classed as a PREFIX.
# A PREFIX is used to identify the intended recipient of the communication.
# Different records can share the same PREFIX.
#
########################################################################################


#
# GENERAL:
# 	SPEECH			(Identifies the context of a piece of speech)
#	GET_SPEECH		(Say an item of speech identified by the code variables)
#	ANIM			(Perform an identified anim)
#	GET_ANIM		(Perform an anim that uses code variables as a reference)
#	JOIN_SPEECH		(Perform speech that joins together two parts)
#	LOOP/ENDLOOP		(Loop through all entities being communicated with)
#
# GET_SPEECH:
#	Say_ServantName		(Issues the name of the servant identified by the loop)
#	Say_AreaName		(Issues the name of the target area)
#
# GET_ANIM:
#	Point_Enemy		(Point to the entity identified as he current enemy)
#
# ANIM and GET_ANIM:
#	ToFinish		(Perform this anim to the finish before doing anything more)
#	NoWait			(If of an appropriate type, do next action before anim ends)


#
# PREFIXes
# NOTE: The word "prefix" must be lowercase.
# Need a USE: 		(Radio, Speech, Gesture)
# Need a NUMBER:	(One, Many, Group, All)
#				One:	intended for one hunter
#				Many:	intended for many individually specified hunters
#				Group:	intended for a collective (one of you, three of you)
#				All:	intended for all hunters
# Need the prefix code.

# Radio message to many individually named hunters
RECORD prefix
	USE		Radio
	NUMBER		Many

	LOOP
			GET_SPEECH		Say_ServantName
	ENDLOOP
END

RECORD prefix
	USE		Radio
	NUMBER		One

	GET_SPEECH	Say_ServantName
END

RECORD prefix
	USE		Radio
	NUMBER		Group

	SPEECH		Address_Many
END

RECORD prefix
	USE		Radio
	NUMBER		All

	SPEECH		Address_Pack
END


#
# BODYs
# Need an ACTION:	multiple of one type are allowed
#			VALID: No_Comms, Chase.
# Need a USE:		(Radio, Speech, Gesture)
# Need an AI_TYPE:	(Disorganised, Methodical, Creepy, Any)
# Need a COMMS_TYPE:	(Senses, Command, Acknowledge, Taunt, Comment, Banter)
# Need PREFIXes:	(Number: ie: None, One, Many, Group, All) - multiple allowed
# Need the body code:	(anims and speech context)


#
#
# LEADER BROADCASTS
#
#

# A radio command to run to investigate a location
RECORD module
	ACTION		RunToInvestigate
	USE		Radio
	AI_TYPE		Any
	COMMS_TYPE	Command

	PREFIX		One
	PREFIX		Many

	JOIN_SPEECH	Start_Investigate	Say_AreaName
END

# A radio command to chase the enemy
RECORD module
	ACTION		Chase
	USE		Radio
	AI_TYPE		Any
	COMMS_TYPE	Command

	PREFIX		One
	PREFIX		Many
	PREFIX		Group

	SPEECH		Start_Chase
END

# A radio command to fight the enemy using Melee Combat
RECORD module
	ACTION		CombatMelee
	USE		Radio
	AI_TYPE		Any
	COMMS_TYPE	Command

	PREFIX		One
	PREFIX		Many
	PREFIX		Group

	SPEECH		Start_Melee_Combat
END

# A radio command to search for the enemy
RECORD module
	ACTION		Search
	USE		Radio
	AI_TYPE		Any
	COMMS_TYPE	Command

	PREFIX		One
	PREFIX		Many
	PREFIX		Group

