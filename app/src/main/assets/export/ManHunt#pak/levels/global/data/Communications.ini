END

# A radio command to call off the hunt
RECORD module
	ACTION		CallOffAlert
	USE		Radio
	AI_TYPE		Any
	COMMS_TYPE	Command

	PREFIX		All
	PREFIX		None

	SPEECH		Call_Off_Alert
END


